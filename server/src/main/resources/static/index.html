<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileShare - Prześlij Plik</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="card">
    <div class="icon">📁</div>
    <h2>FileShare</h2>
    <p>Wybierz plik z telefonu, aby przesłać go na komputer</p>

    <!-- Formularz wysyłania pliku -->
    <form action="/upload" method="post" enctype="multipart/form-data">
        <label for="file-input" class="custom-file-upload">
            Wybierz plik
        </label>
        <input id="file-input" type="file" name="file" required onchange="updateFileName()">

        <div id="file-name" class="file-name">Nie wybrano pliku</div>

        <button type="submit" class="submit-btn">Wyślij na komputer 🚀</button>
    </form>
</div>

<script>
    function updateFileName() {
        const input = document.getElementById('file-input');
        const nameDisplay = document.getElementById('file-name');
        if (input.files.length > 0) {
            nameDisplay.textContent = "Wybrany plik: " + input.files[0].name;
            nameDisplay.style.color = "#2e7d32";
            nameDisplay.style.fontWeight = "bold";
        } else {
            nameDisplay.textContent = "Nie wybrano pliku";
            nameDisplay.style.color = "#666";
            nameDisplay.style.fontWeight = "normal";
        }
    }
</script>
</body>
</html>
