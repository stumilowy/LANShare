<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileShare - Upload File</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="card">
    <div class="icon">📁</div>
    <h2>FileShare</h2>
    <p>Choose a file from your phone to upload it to the computer</p>

    <div id="success-alert" class="alert-success">
        File uploaded successfully! 🎉
    </div>

    <form action="/upload" method="post" enctype="multipart/form-data">
        <div class="file-input-container">
            <div class="input-group">
                <label for="custom-name-input">Custom File Name (Optional):</label>
                <input id="custom-name-input" type="text" name="customFileName" class="text-input" placeholder="e.g. my_holiday_photo">
            </div>

            <label for="file-input" class="custom-file-upload">
                Choose File
            </label>
            <input id="file-input" type="file" name="file" required onchange="handleFileChange()">

            <div id="file-name" class="file-name">No file chosen</div>
        </div>

        <button type="submit" class="submit-btn">Send to Computer 🚀</button>
    </form>
</div>

<script>
    function handleFileChange() {
        const input = document.getElementById('file-input');
        const nameDisplay = document.getElementById('file-name');
        const customNameInput = document.getElementById('custom-name-input');

        if (input.files.length > 0) {
            const originalName = input.files[0].name;
            nameDisplay.textContent = "Selected file: " + originalName;
            nameDisplay.style.color = "#2e7d32";
            nameDisplay.style.fontWeight = "bold";

            // Automatycznie podpowiada nazwę bez rozszerzenia w polu tekstowym
            const lastDotIndex = originalName.lastIndexOf('.');
            if (lastDotIndex !== -1) {
                customNameInput.value = originalName.substring(0, lastDotIndex);
            } else {
                customNameInput.value = originalName;
            }
        } else {
            nameDisplay.textContent = "No file chosen";
            nameDisplay.style.color = "#666";
            nameDisplay.style.fontWeight = "normal";
            customNameInput.value = "";
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('status') === 'success') {
            const alertBox = document.getElementById('success-alert');
            alertBox.style.display = 'block';
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    });
</script>
</body>
</html>
